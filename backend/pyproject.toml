[project]
name = "tallgrass-planner-backend"
version = "1.0.0"
description = "Calculation engine and API for the Tallgrass personal wealth and retirement planner"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=43",
    "httpx>=0.27",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 136
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E731"]

[tool.ruff.lint.per-file-ignores]
# Closures in the year loop are called within the same iteration.
"app/engine/simulate.py" = ["B023"]

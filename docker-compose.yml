# One command runs everything:  docker compose --env-file deploy/production.env up -d
# Use deploy/staging.env for a separate staging copy (different project name, ports and database).
name: ${COMPOSE_PROJECT_NAME:-planner}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://planner:${POSTGRES_PASSWORD}@db:5432/planner
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_DPA_CONFIRMED: ${AI_DPA_CONFIRMED:-false}
      AGGREGATION_PROVIDER: ${AGGREGATION_PROVIDER:-none}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_ENV: ${PLAID_ENV:-sandbox}

  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    restart: unless-stopped
    depends_on: [api]
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"

  backup:
    # Daily database backup, kept for BACKUP_KEEP_DAYS days, in ./backups/<project>.
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups/${COMPOSE_PROJECT_NAME:-planner}:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]

volumes:
  db-data:
